# CodeQL static analysis.
#
# Free for public repositories; on private ones it needs GitHub Advanced
# Security. This repository starts private, so the job is guarded on visibility
# rather than left to fail every run — it starts working by itself the moment the
# repository is made public.

name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 5 * * 1" # Mondays, so a new rule release is picked up weekly

permissions:
  contents: read

jobs:
  analyze:
    name: analyze go
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event.repository.visibility == 'public'
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: .go-version
          cache: true

      - uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          languages: go
          queries: security-and-quality

      - uses: github/codeql-action/autobuild@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4

      - uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          category: /language:go
