# Actions are pinned to commit SHAs rather than tags. A tag is a movable
# reference: whoever controls the action repository can change what `@v7` points
# at, and CI runs with a token that can read this repository. For a networking
# product that is not a theoretical concern. Dependabot keeps the pins current —
# see .github/dependabot.yml.
#
# Every job carries a timeout. On a free organisation, private repositories share
# 2,000 Actions minutes a month, and a single hung job can quietly eat the lot.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The toolchain version lives in .go-version, which every setup-go step here reads and
# which the Makefile hands to the Dockerfile. One file rather than an env var per workflow:
# these three workflows and three more places outside them used to carry it separately, and
# four of the six floated on a major version — which is how a stdlib CVE stayed shipped
# after the fix had already landed in CI.

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: .go-version
          cache: true
      - run: make lint

      # go.mod carried a stale "// indirect" on a module imported directly, because
      # nothing checked. -diff writes nothing, so a failure here leaves no mess behind.
      - name: go.mod is tidy
        run: make tidy-check

      # The protos have had this check since the beginning; the database bindings never
      # did, and were found stale — a query's comments had been edited without
      # regenerating, so the committed Go described an older version of its own SQL.
      # ADR-0013 commits generated code so nobody needs the toolchain to build; that only
      # holds while what is committed is what the generator produces.
      - name: committed database code matches the queries
        run: |
          make sqlc
          if ! git diff --exit-code -- internal/store/gen/; then
            echo "internal/store/gen is not what sqlc generates from queries/; run 'make sqlc' and commit the result"
            exit 1
          fi

  test:
    name: test and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: .go-version
          cache: true

      - run: make build
      - name: binaries report their version
        run: for b in meshp meshpd meshp-control meshp-relay; do ./bin/$b --version; done

      - name: test with the race detector
        run: make test

      # The packages that decide addressing and where traffic goes are gated, not
      # merely measured. Everything else is reported for information.
      - name: coverage floors
        run: |
          {
            echo "### Coverage"
            echo
            echo '```'
            make cover-check
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: total coverage
        run: |
          make cover
          echo "total: $(go tool cover -func=cover.out | tail -1 | awk '{print $3}')" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: coverage
          path: cover.out
          retention-days: 7

  cross:
    name: cross compile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: .go-version
          cache: true

      # Go cross-compiles pure Go cleanly, so one Linux runner catches almost
      # every platform break at a fraction of the cost of a native matrix —
      # macOS runners bill at ten times the rate. Native runners become necessary
      # once there is platform code that must actually run: WireGuard interface
      # manipulation, firewall rules, DNS integration. There is none yet, and
      # this comment is here so that adding it does not go unnoticed.
      #
      # ios/arm64 is absent because it requires cgo and an Xcode toolchain. It is
      # compiled by the meshp-ios repository.
      - name: every shipping platform compiles
        run: |
          {
            echo "### Cross compilation"
            echo
            echo '```'
            make cross
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  proto:
    name: protocol compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: .go-version
          cache: true

      - name: lint
        run: go run github.com/bufbuild/buf/cmd/buf@v1.47.2 lint

      # Agents in the field are older than the server, sometimes by a year. A
      # field that is removed or renumbered breaks every one of them, so this is
      # a hard gate rather than advice.
      - name: no changes that break deployed agents
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin ${{ github.base_ref }}
          go run github.com/bufbuild/buf/cmd/buf@v1.47.2 breaking \
            --against ".git#branch=origin/${{ github.base_ref }}"

      # Generated bindings are committed (ADR-0013), so the only thing that can go
      # wrong is drift: a .proto edited without regenerating, or generated code
      # edited by hand. Regenerating and diffing catches both.
      - name: committed bindings match the protos
        run: |
          make proto
          if ! git diff --exit-code -- proto/; then
            echo
            echo "proto/gen is out of date. run 'make proto' and commit the result."
            exit 1
          fi
          echo "committed bindings match"

      - name: generated code compiles
        run: go build ./... && go vet ./...

  migrations:
    name: migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: meshp
          POSTGRES_PASSWORD: meshp
          POSTGRES_DB: meshp
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U meshp -d meshp"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: apply, roll back and re-apply
        env:
          MESHP_TEST_DATABASE_URL: postgres://meshp:meshp@localhost:5432/meshp?sslmode=disable
        run: |
          chmod +x scripts/migrate-check.sh
          {
            echo "### Migrations"
            echo
            echo '```'
            make migrate-check
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  integration:
    name: integration (postgres)
    runs-on: ubuntu-latest
    # Generous because the failover run waits out a real liveness window: internal/tunnel
    # treats a handshake as live for three minutes, so the earliest possible failover is a
    # little past that, and a run where failover never happens waits the poll out before it
    # can say so. Too tight a budget turns that into a job timeout, which reports the wrong
    # cause — the message an operator needs is "the client never moved", not "cancelled".
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: meshp
          POSTGRES_PASSWORD: meshp
          POSTGRES_DB: meshp
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U meshp -d meshp"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      MESHP_TEST_DATABASE_URL: postgres://meshp:meshp@localhost:5432/meshp?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: .go-version
          cache: true

      # The store package's interesting behaviour is behaviour PostgreSQL
      # provides — advisory locks, transactional DDL, statement timeouts. Tested
      # against a fake, these would assert only that the fake agrees with itself,
      # so they skip without a database and are gated here instead.
      - name: tests that need a database
        run: make integration

      - name: coverage floor
        run: |
          {
            echo "### Integration coverage"
            echo
            echo '```'
            make cover-check-db
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # The unit tests cover each step against a library. This covers what a person
      # actually runs — flag parsing, file modes, exit codes — which is where the
      # wiring mistakes live.
      - run: sudo apt-get install -y --no-install-recommends wireguard-tools

      # The script is invoked directly below rather than through `make e2e`, which depends
      # on `build` — so the binaries have to be built here.
      - run: make build

      # Under sudo, so the tunnel assertions in the script actually execute. They skip
      # without the privilege to create interfaces, and a skip here is a silent pass: the
      # assertions would only ever have run on a developer's machine.
      - name: enrol a device end to end, with a real tunnel
        run: |
          set -o pipefail
          {
            echo "### Enrolment end to end"
            echo
            echo '```'
            sudo -E env "PATH=$PATH" ./scripts/e2e-enrol.sh "$MESHP_TEST_DATABASE_URL" 2>&1 | tee e2e.log
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: the tunnel assertions were not skipped
        run: |
          if grep -q "skipped: needs Linux, root" e2e.log; then
            echo "the end-to-end tunnel assertions skipped, so they gate nothing"
            exit 1
          fi
          grep -q "up, kernel" e2e.log \
            || { echo "the end-to-end run never reported a kernel tunnel"; exit 1; }
          echo "the tunnel came up and was asserted"

      - name: a name resolved on the machine holding it
        run: |
          # The one assertion that tests the feature rather than its parts. Everything else
          # about DNS -- the wire format, the zones, resolvectl, the port -- is covered by
          # tests that ask meshp directly, and all of them pass on a machine where no
          # ordinary program can find these names. Silence here would mean the runner
          # skipped it, which is how a feature ends up gated by nothing.
          if grep -q "skipped-resolver" e2e.log; then
            echo "the name assertions skipped, so the DNS feature gates nothing"
            sed -n 's/.*skipped-resolver: /reason: /p' e2e.log
            exit 1
          fi
          grep -q "through this host's own resolver" e2e.log \
            || { echo "no name was resolved through the host resolver"; exit 1; }
          sed -n 's/^  \(.* -> .*through this host.s own resolver\)/resolved: \1/p' e2e.log

      # Two agents at once, which the enrolment script cannot do: every device is handed
      # the interface name meshp0, so two daemons on one host fight over it. A namespace
      # each is what makes a real handshake — and therefore a real reachability report —
      # possible to assert.
      - name: two agents in network namespaces, reporting to the control plane
        run: |
          set -o pipefail
          {
            echo "### Two agents, two namespaces"
            echo
            echo '```'
            sudo -E env "PATH=$PATH" ./scripts/e2e-failover.sh "$MESHP_TEST_DATABASE_URL" 2>&1 | tee failover.log
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: the namespace assertions were not skipped
        run: |
          if grep -q "^skipped:" failover.log; then
            echo "the namespace run skipped, so it gates nothing"
            sed -n 's/^skipped: /reason: /p' failover.log
            exit 1
          fi
          # The one assertion this run exists for. A device with no chooser routes through
          # the server's first candidate and passes every other check in that script.
          grep -q "recorded the client's verdict" failover.log \
            || { echo "no reachability report reached the control plane"; exit 1; }
          echo "a verdict from a live client reached the control plane"

      # The claim ADR-0004 has made since the beginning: one technician, two customers, both
      # on 192.168.1.0/24. Every part of ADR-0020 had tests and the feature did not, and this
      # run found two defects on its first complete pass -- a shared nftables table, and a
      # collision created in one network that the other was never told about.
      - name: two customers on one prefix, both reachable
        run: |
          set -o pipefail
          {
            echo "### Overlapping customer prefixes"
            echo
            echo '```'
            sudo -E env "PATH=$PATH" ./scripts/e2e-overlap.sh "$MESHP_TEST_DATABASE_URL" 2>&1 | tee overlap.log
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: the overlap assertions were not skipped
        run: |
          if grep -q "^skipped:" overlap.log; then
            echo "the overlap run skipped, so the feature gates nothing"
            sed -n 's/^skipped: /reason: /p' overlap.log
            exit 1
          fi
          # The crossover assertions are the ones that cannot be faked: both customers answer
          # at 192.168.1.5, so a misrouted packet still finds a machine there.
          grep -q "neither address reaches the other customer" overlap.log \
            || { echo "the two customers were never shown to be distinguishable"; exit 1; }
          echo "two customers on one prefix are reachable and distinct"

  migrations-immutable:
    name: migrations are append only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # Editing a migration that has already been merged means databases that ran
      # the old version and databases that ran the new one disagree, with nothing
      # recording which is which. New behaviour goes in a new file.
      #
      # This runs on pull requests only. Before the first tagged release no
      # database anywhere has run these migrations, so a maintainer pushing
      # directly to main may still amend them — and did, once, to move 'draining'
      # out of advertiser_health. From v0.1.0 onward that stops being true and
      # this check is the whole of the policy.
      - name: no edits to already-merged migrations
        run: |
          git fetch --no-tags origin ${{ github.base_ref }}
          changed=$(git diff --name-only --diff-filter=MDR \
            "origin/${{ github.base_ref }}...HEAD" -- migrations/ || true)
          if [ -n "$changed" ]; then
            echo "these migrations already exist on ${{ github.base_ref }} and must not be changed:"
            echo "$changed" | sed 's/^/  /'
            echo
            echo "add a new migration instead."
            exit 1
          fi
          echo "no existing migrations were modified"

  standalone:
    name: core builds standalone
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: .go-version
          cache: true
      # Invariant 12. The commercial layer talks to this over HTTP and is never
      # linked into it, so self-hosters run exactly the binary we run.
      - run: make standalone-check

  reachability:
    name: everything defined is reached
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # ADR-0018, checked rather than remembered. Three mechanisms have sat unreached for
      # months apiece and each was found by somebody reading nearby code for another reason
      # (#121). Needs no toolchain: it reads the schema, the protocol and the queries.
      - run: ./scripts/reachability-check.sh

  vuln:
    name: vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: .go-version
          cache: true
      - run: make vuln

  fuzz-seeds:
    name: fuzz seed corpora
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: .go-version
          cache: true
      # Seeds only, which is fast. Extended fuzzing runs nightly in fuzz.yml, and
      # any input it finds is committed here as a seed so it can never regress.
      - run: make fuzz-seeds

  dco:
    name: dco sign-off
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Bots do not sign off, and their pull requests only ever touch dependency
    # manifests. Demanding a sign-off from them would leave every Dependabot pull
    # request permanently red, which trains everyone to ignore a red check.
    if: >-
      github.event_name == 'pull_request' &&
      github.actor != 'dependabot[bot]' &&
      github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: every commit is signed off
        run: |
          git fetch --no-tags origin ${{ github.base_ref }}
          missing=0
          # --no-merges matters. For a pull_request event, HEAD is a merge commit
          # GitHub synthesises to preview the result; nobody authored it and
          # nobody can sign it off. Merges a contributor makes themselves are
          # skipped for the same reason: they carry no content to attest to.
          while read -r sha; do
            if ! git log -1 --format=%B "$sha" | grep -qiE '^Signed-off-by: .+ <.+@.+>'; then
              echo "missing Signed-off-by: $(git log -1 --oneline "$sha")"
              missing=1
            fi
          done < <(git rev-list --no-merges "origin/${{ github.base_ref }}..HEAD")
          if [ "$missing" -ne 0 ]; then
            echo
            echo "sign commits with 'git commit -s', or fix history with:"
            echo "  git rebase --signoff origin/${{ github.base_ref }}"
            exit 1
          fi
          echo "all commits are signed off"

  # A single check for branch protection to require. Without this, protection has
  # to name every job, and renaming or adding one silently stops being enforced.
  image:
    name: container image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: meshp
          POSTGRES_PASSWORD: meshp
          POSTGRES_DB: meshp
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U meshp -d meshp"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Until this job existed nothing built the Dockerfile at all, so it could have
      # been broken for weeks without anything saying so — and the dependency bumps
      # that only touch it had no check to pass.
      - name: build
        run: make image VERSION=ci-${{ github.sha }} COMMIT=${{ github.sha }}

      # A binary whose -X paths are wrong still builds, still runs, and reports
      # "dev" forever. Nothing else notices, and the first person to need the
      # version of a running container is debugging an incident.
      - name: the image reports the version it was stamped with
        run: |
          out="$(docker run --rm meshp:ci --version)"
          echo "$out"
          echo "$out" | grep -q "ci-${{ github.sha }}" \
            || { echo "the image does not carry the version it was built with"; exit 1; }
          echo "$out" | grep -q "${{ github.sha }}" \
            || { echo "the image does not carry its commit"; exit 1; }

      - name: it does not run as root
        run: |
          uid="$(docker run --rm --entrypoint id meshp:ci -u)"
          echo "uid=$uid"
          [ "$uid" != "0" ] || { echo "the image runs as root"; exit 1; }

      # The real question: does the thing we ship start, migrate and become ready.
      # Building it only proves the compiler was happy.
      - name: it starts, migrates and reports ready
        run: ./scripts/image-smoke.sh
        env:
          MESHP_IMAGE: meshp:ci
          MESHP_DATABASE_URL: postgres://meshp:meshp@127.0.0.1:5432/meshp?sslmode=disable

  dataplane:
    name: data plane (real interfaces)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: .go-version
          cache: true

      - name: the kernel here can do WireGuard
        run: |
          sudo modprobe wireguard || true
          sudo ip link add dev wgprobe type wireguard
          sudo ip link del dev wgprobe
          echo "this runner can create WireGuard interfaces"

      # netcat-openbsd is what the mapping tests listen with: proving two customers on the
      # same prefix are distinguishable needs a service on each of them, and ping cannot say
      # which machine answered.
      - run: sudo apt-get install -y --no-install-recommends wireguard-tools nftables netcat-openbsd

      # Creating interfaces and entering namespaces both need root, so these tests skip
      # rather than fail without it — which means an unprivileged run would report success
      # while testing nothing. A skip is therefore treated as a failure here. -E keeps the
      # Go environment across sudo, and -run is not narrowed: the point is that all of them
      # run somewhere.
      # pathprobe is here for the same reason wglink is: whether a socket bound to an
      # interface actually leaves by it cannot be tested without real interfaces, and a
      # probe that quietly used the routing table would report an advertiser healthy while
      # measuring the local network.
      # resolved needs systemd-resolved to be the thing answering names here, which is true
      # of this runner and is asserted rather than assumed: the step below fails on a skip,
      # so a runner image that stopped shipping it would be a loud failure rather than a
      # test quietly not running.
      - name: this runner's names are answered by systemd-resolved
        run: |
          resolvectl status >/dev/null
          sudo modprobe dummy || true
          echo "systemd-resolved is answering here"

      # Docker is installed on this runner and sets the forward policy to DROP. A drop in one
      # table wins over an accept in another, so meshp's forwarding chain cannot undo it and
      # the packet tests below measure the runner image rather than meshp.
      #
      # Set here rather than worked around in the tests, because the tests are right: they
      # prove the ruleset carries a packet when nothing else is refusing it. That another
      # tool can silently defeat meshp's forwarding is a real defect in meshp and is filed
      # separately -- it is not something this job should paper over quietly, which is why
      # the previous policy is printed.
      - name: nothing else on this runner is dropping forwarded packets
        run: |
          echo "before: $(sudo iptables -L FORWARD -n | head -1)"
          sudo iptables -P FORWARD ACCEPT
          echo "after:  $(sudo iptables -L FORWARD -n | head -1)"

      # nftables joins them for the reason the others are here, and it arrives late: this
      # package has held real-packet tests since the forwarding work — a packet crossing into
      # a carried LAN, and stopping when the group is withdrawn — and none of them has ever
      # run in CI. They need root, so the unprivileged test job skips them, and this job did
      # not name the package. They gated nothing. Adding it also gates the mapping tests,
      # which are the only place two customers on 192.168.1.0/24 are proven distinguishable.
      - name: interfaces, routes, teardown, a packet across the tunnel, a bound probe, the host resolver, and two customers on one prefix
        run: |
          set -o pipefail
          sudo -E env "PATH=$PATH" go test ./internal/wglink/ ./internal/pathprobe/ ./internal/resolved/ ./internal/nftables/ -count=1 -v 2>&1 | tee dataplane.log
        continue-on-error: false

      - name: report, and refuse a silent skip
        if: always()
        run: |
          {
            echo "### Data plane"
            echo
            echo '```'
            grep -E '^(--- |ok|FAIL)|a packet crossed|bound to' dataplane.log || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if grep -q -- "--- SKIP" dataplane.log; then
            grep -- "--- SKIP" dataplane.log
            echo "data-plane tests were skipped, which reports success without testing anything"
            exit 1
          fi
          echo "no data-plane test was skipped"

  # The macOS data plane, on a real macOS kernel, creating a real utun.
  #
  # It lands with the implementation rather than before or after it (#144). Before, there
  # was nothing here but a stub returning ErrUnsupported and this job would have exercised
  # it; after, there would be a window where a data plane was merged and had never created
  # an interface on the platform it was written for. ADR-0018 is about exactly that gap.
  #
  # What this proves that `cross compile` does not: that a utun can be created at all, that
  # wgctrl configures it over the UAPI socket the same way it configures a kernel device on
  # Linux (ADR-0015's central bet), and that the routing table can be read back accurately
  # enough to reconcile against.
  dataplane-macos:
    name: data plane (macOS)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: .go-version
          cache: true

      # No separate "can this runner make a utun" probe. The test is that probe: it fails
      # loudly if creation does not work, and the skip check below catches the other way it
      # could report nothing — sudo not taking, so the tests run unprivileged and skip.
      #
      # Creating a utun goes through PF_SYSTEM and needs root, so these tests skip without
      # it, which means an unprivileged run would report success while testing nothing.
      # A skip is therefore a failure here, exactly as it is for the Linux job. -E keeps the
      # Go environment across sudo.
      # resolved joins wglink here because it has the same shape of unknown: whether
      # mDNSResponder collects a supplemental domain from a service key meshp invented, on a
      # non-standard port, is not something that can be reasoned about — it either does or
      # it does not, and only a real macOS can say.
      - name: a utun comes up and is observed back, and macOS sends mesh names to meshp
        run: |
          set -o pipefail
          sudo -E env "PATH=$PATH" go test ./internal/wglink/ ./internal/resolved/ -count=1 -v 2>&1 | tee dataplane-macos.log

      - name: report, and refuse a silent skip
        if: always()
        run: |
          {
            echo "### Data plane (macOS)"
            echo
            echo '```'
            grep -E '^(--- |ok|FAIL)' dataplane-macos.log || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if grep -q -- "--- SKIP" dataplane-macos.log; then
            grep -- "--- SKIP" dataplane-macos.log
            echo "macOS data-plane tests were skipped, which reports success without testing anything"
            exit 1
          fi
          echo "no macOS data-plane test was skipped"

  ci-required:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [lint, test, cross, proto, integration, migrations, migrations-immutable, standalone, reachability, image, dataplane, dataplane-macos, vuln, fuzz-seeds, dco]
    steps:
      - name: report
        run: |
          echo "results: ${{ join(needs.*.result, ', ') }}"
          # Skipped is acceptable: the pull-request-only jobs do not run on pushes
          # to main. Failure and cancellation are not.
          if echo "${{ join(needs.*.result, ',') }}" | grep -qE 'failure|cancelled'; then
            echo "at least one required job did not pass"
            exit 1
          fi
          echo "all required jobs passed"
