# Workflow actions are pinned to commit SHAs, which is only sustainable if
# something keeps them current. That is this file's main job.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci"
    labels: ["dependencies", "ci"]
    open-pull-requests-limit: 5

  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "deps"
    labels: ["dependencies"]
    open-pull-requests-limit: 5
    groups:
      # One pull request for the golang.org/x modules, which move together and
      # are rarely interesting individually.
      golang-x:
        patterns: ["golang.org/x/*"]

  - package-ecosystem: docker
    directory: "/deploy/docker"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "deps"
    labels: ["dependencies", "docker"]
