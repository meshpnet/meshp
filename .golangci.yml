version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - copyloopvar
    - misspell
    - nilerr
    - revive
    - unconvert
    - wastedassign

  settings:
    revive:
      rules:
        - name: exported
          disabled: true
    misspell:
      # Deliberately no locale. Setting one turns misspell into a US/UK variant
      # converter, and the two halves of this codebase legitimately disagree:
      # prose is written in British English, while identifiers follow the SQL and
      # HTTP-API convention of `organization_id`. With no locale it does the job
      # it is here for — catching actual typos — and stops demanding that the
      # schema be renamed.

  exclusions:
    rules:
      # The filtering platform's structure definitions, taken from wireguard-windows under
      # its own licence (ADR-0030). They are kept whole rather than trimmed to what meshp
      # references, so that they stay diffable against upstream when it changes — deleting
      # the constants nothing here uses would turn the next update from a copy into a merge.
      #
      # Narrow on purpose: two files, one linter. Excluding the package would also hide
      # findings in the files meshp wrote, which is where the value is — and those files were
      # never linted at all until #186, because the lint job only ever saw Linux.
      - path: internal/wfp/types_windows(_32|_64)?\.go
        linters:
          - unused

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/meshpnet/meshp


issues:
  max-same-issues: 0
  max-issues-per-linter: 0
