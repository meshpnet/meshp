version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: queries
    gen:
      go:
        package: dbgen
        out: internal/store/gen
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        emit_json_tags: false
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          # Both nullability cases are overridden. Leaving the non-null case to
          # sqlc's default gives pgtype.Timestamptz for NOT NULL columns and
          # *time.Time for nullable ones, so every caller has to remember which
          # kind of timestamp it is holding.
          - db_type: timestamptz
            go_type:
              import: time
              type: Time
          - db_type: timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
