# The self-hosting contract: `docker compose up` gives a working control plane
# and relay with no further steps. If that stops being true, treat it as a
# release blocker — it is the entire first impression of the project.

name: meshp

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: meshp
      POSTGRES_PASSWORD: meshp
      POSTGRES_DB: meshp
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      # Loopback. The control plane reaches this over the compose network and does not need
      # the published port at all; it is here because `make dev` is how CONTRIBUTING tells
      # somebody to get a database for the integration tests, and those connect from the
      # host. `"5432:5432"` binds every interface, which put a database holding enrolment
      # tokens, policies and password hashes on the local network with the credentials three
      # lines above — on café wifi, for anybody on the subnet.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meshp -d meshp"]
      interval: 3s
      timeout: 3s
      retries: 20

  control:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      args:
        VERSION: ${MESHP_VERSION:-dev}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MESHP_DATABASE_URL: postgres://meshp:meshp@postgres:5432/meshp?sslmode=disable
      MESHP_LISTEN_ADDR: ":8080"
      MESHP_CONTROL_URL: ${MESHP_CONTROL_URL:-http://localhost:8080}
      MESHP_SECRET_KEY: ${MESHP_SECRET_KEY:-dev-only-insecure-key-change-me}
      # Empty by default, which leaves the administrative API switched off. Set it
      # in .env to mint enrolment tokens.
      MESHP_ADMIN_TOKEN: ${MESHP_ADMIN_TOKEN:-}
      MESHP_LOG_LEVEL: ${MESHP_LOG_LEVEL:-info}
      MESHP_LOG_FORMAT: ${MESHP_LOG_FORMAT:-text}

      # No default address prefixes here. Two used to be set and nothing read them, so an
      # operator could change where their devices are addressed and watch it do nothing.
      # Pools belong to a network and are given when it is created, because two networks on
      # one control plane are meant to be able to use different ones.

      # Relaying, which is what makes this stack able to carry a packet. Nothing discovers
      # direct paths yet, so a deployment with no relay gives agents peers they cannot
      # reach (ADR-0002) — and this file's contract is that `docker compose up` gives a
      # working control plane and relay with no further steps.
      #
      # The default keypair below is published in this repository and is therefore worth
      # nothing: anyone can mint relay capabilities against it. It is here so the stack
      # works out of the box, in the same spirit as the dev secret key above, and both
      # must be replaced before anything real. `meshp-control --generate-relay-key`
      # prints a fresh pair.
      MESHP_RELAYS: ${MESHP_RELAYS:-local=relay:3478}
      MESHP_RELAY_SIGNING_KEY: ${MESHP_RELAY_SIGNING_KEY:-OS4iBtA9dZDL4Y9nIT5NY8YejmveFfhJ/M4JpiT+GUk=}
    ports:
      # Loopback, because every URL in the quickstart is http://localhost:8080 and this
      # stack is how somebody tries meshp rather than how they run it. Publishing on every
      # interface would put an API that mints enrolment tokens on the network of whatever
      # machine ran `docker compose up`, which on a VPS means the internet. A real
      # deployment is docs/self-hosting.md, which serves TLS and does not use this file; if
      # you want this one reachable from elsewhere anyway, change the address here and know
      # that it is plaintext.
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12

  relay:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    entrypoint: ["/usr/local/bin/meshp-relay"]
    depends_on:
      control:
        condition: service_started
    environment:
      # The public half of the pair the control plane signs with. A relay verifies
      # capabilities it cannot mint, so this one being public costs nothing on its own —
      # the private half above is what must not be (ADR-0017).
      MESHP_RELAY_ISSUER_KEY: ${MESHP_RELAY_ISSUER_KEY:-wjmzw3Eo36tjSd+v8qd7RgGNWQaFvAkJs917vmhmtaY=}
      MESHP_RELAY_LISTEN: ${MESHP_RELAY_LISTEN:-:3478}
      MESHP_LOG_LEVEL: ${MESHP_LOG_LEVEL:-info}

      # MESHP_RELAY_ADMIN_ADDR is deliberately unset. The binary defaults it to
      # 127.0.0.1:9090 and says why — the health and statistics endpoint is not
      # authenticated — and this file used to override that to :9090 and publish it, which
      # undid the decision without recording one. Read it with
      # `docker compose exec relay wget -qO- http://127.0.0.1:9090/stats`.
    ports:
      # The one port that has to be published, and the reason is the whole point of a
      # relay: agents reach it from wherever they are, so loopback would make this stack
      # unable to carry a packet for any device but the host's own (ADR-0016).
      - "3478:3478/udp"

volumes:
  postgres-data:
